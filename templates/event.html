<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ event.name }} - EventBook</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <header class="navbar">
    <div class="container">
      <div class="brand">EventBook</div>
      <nav>
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('bookings') }}">My Bookings</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="event-detail">
      <h2>{{ event.name }}</h2>

      <div class="meta-row">
        <span>📅 {{ event.date }}</span>
        <span>⏰ {{ event.time }}</span>
        <span>📍 {{ event.venue }}</span>
        <span>🎟️ {{ event.available_seats }} seats available</span>
      </div>

      <p class="description">{{ event.description }}</p>

      <div class="action-row">
        {% if event.available_seats > 0 %}
        <a href="{{ url_for('book', event_id=event.id) }}" class="btn btn-primary">Book Now</a>
        {% else %}
        <span class="btn btn-secondary" style="opacity:0.6;cursor:not-allowed;">Sold Out</span>
        {% endif %}
        <a href="{{ url_for('home') }}" class="btn btn-secondary">Back</a>
      </div>
    </div>
  </main>

  <footer>
    &copy; 2026 EventBook. All rights reserved.
  </footer>

</body>
</html>
