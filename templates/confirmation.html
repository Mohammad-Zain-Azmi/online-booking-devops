<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booking Confirmed - EventBook</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <header class="navbar">
    <div class="container">
      <div class="brand">EventBook</div>
      <nav>
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('bookings') }}">My Bookings</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="confirmation-card">
      <div class="success-icon">✅</div>
      <h2>Booking Successful!</h2>

      <div class="confirmation-details">
        <div class="row"><span>Booking ID</span><span>{{ booking.booking_id }}</span></div>
        <div class="row"><span>Event</span><span>{{ event.name }}</span></div>
        <div class="row"><span>Customer Name</span><span>{{ booking.name }}</span></div>
        <div class="row"><span>Email</span><span>{{ booking.email }}</span></div>
        <div class="row"><span>Seats Booked</span><span>{{ booking.seats }}</span></div>
        <div class="row"><span>Event Date</span><span>{{ event.date }}</span></div>
        <div class="row"><span>Venue</span><span>{{ event.venue }}</span></div>
      </div>

      <br>
      <a href="{{ url_for('home') }}" class="btn btn-primary">Back to Home</a>
    </div>
  </main>

  <footer>
    &copy; 2026 EventBook. All rights reserved.
  </footer>

</body>
</html>
