<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book {{ event.name }} - EventBook</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <header class="navbar">
    <div class="container">
      <div class="brand">EventBook</div>
      <nav>
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('bookings') }}">My Bookings</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">Book: {{ event.name }}</h1>

    <div class="form-card">
      <form action="{{ url_for('book', event_id=event.id) }}" method="POST">

        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" placeholder="Enter your full name" required minlength="2" maxlength="80">
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
          <label for="seats">Number of Seats</label>
          <div class="seat-stepper">
            <button type="button" id="seat-minus" aria-label="Decrease seats">−</button>
            <input type="number" id="seats" name="seats" min="1" max="{{ event.available_seats }}" value="1" required>
            <button type="button" id="seat-plus" aria-label="Increase seats">+</button>
          </div>
          <p class="seat-hint">{{ event.available_seats }} seats available</p>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Confirm Booking</button>
      </form>
    </div>
  </main>

  <footer>&copy; 2026 EventBook. All rights reserved.</footer>

  <script>
    (function () {
      var input = document.getElementById('seats');
      var max = parseInt(input.max, 10) || 1;
      var min = parseInt(input.min, 10) || 1;

      function clamp(v) {
        if (isNaN(v)) return min;
        return Math.min(max, Math.max(min, v));
      }

      document.getElementById('seat-plus').addEventListener('click', function () {
        input.value = clamp(parseInt(input.value, 10) + 1);
      });
      document.getElementById('seat-minus').addEventListener('click', function () {
        input.value = clamp(parseInt(input.value, 10) - 1);
      });
      input.addEventListener('change', function () {
        input.value = clamp(parseInt(input.value, 10));
      });
    })();
  </script>

</body>
</html>
