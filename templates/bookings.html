<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Bookings - EventBook</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <header class="navbar">
    <div class="container">
      <div class="brand">EventBook</div>
      <nav>
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('bookings') }}">My Bookings</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">All Bookings</h1>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Booking ID</th>
            <th>Event</th>
            <th>Name</th>
            <th>Email</th>
            <th>Seats</th>
            <th>Booked On</th>
          </tr>
        </thead>
        <tbody>
          {% for b in bookings %}
          <tr>
            <td>{{ b.booking_id }}</td>
            <td>{{ b.event_name }}</td>
            <td>{{ b.name }}</td>
            <td>{{ b.email }}</td>
            <td>{{ b.seats }}</td>
            <td>{{ b.booking_date }}</td>
          </tr>
          {% else %}
          <tr>
            <td colspan="6" style="text-align:center;">No bookings yet.</td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </main>

  <footer>
    &copy; 2026 EventBook. All rights reserved.
  </footer>

</body>
</html>
